services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # One-shot setup: downloads the handbook and builds the Qdrant index.
  # Run once with: docker compose --profile setup run --rm indexer
  indexer:
    profiles: ["setup"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["sh", "-c", "python -m src.data.download_handbook && python -m src.retrieval.build_index"]
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ../data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - qdrant
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["streamlit", "run", "src/api/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  qdrant_data:
  hf_cache: