[project]
name = "llm-enterprise-assistant"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "python-dotenv",
    "torch",
    "sentence-transformers",
    "qdrant-client>=1.20.0",
    "bitsandbytes>=0.50.2",
    "accelerate>=1.15.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "streamlit>=1.65.0",
    "httpx>=0.28.1",
    "trl>=1.14.2",
    "peft>=0.21.2",
    "mlflow>=3.17.2",
    "datasets>=5.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pytest",
    "ruff"
]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks", "generate_project_structure.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
